<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<title>Вход в админку</title>


<style>

body {

    font-family: Arial, sans-serif;
    background:#f5f5f5;

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

}



.login-box {

    background:white;

    width:320px;

    padding:30px;

    border-radius:15px;

    box-shadow:0 5px 20px #ccc;

}



h2 {

    text-align:center;

}



input {

    width:100%;

    padding:12px;

    margin-bottom:15px;

    box-sizing:border-box;

}



button {

    width:100%;

    padding:12px;

    background:#111;

    color:white;

    border:none;

    border-radius:8px;

    cursor:pointer;

}



button:hover {

    opacity:0.8;

}



#error {

    color:red;

    text-align:center;

}



</style>


</head>


<body>



<div class="login-box">


<h2>
Вход администратора
</h2>



<input 
id="login"
placeholder="Логин"
>



<input 
id="password"
type="password"
placeholder="Пароль"
>



<button onclick="login()">

Войти

</button>



<p id="error"></p>


</div>





<script src="./js/login.js"></script>



</body>


</html>
